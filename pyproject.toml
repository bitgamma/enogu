[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen"
version = "0.1.0"
description = "Image generation webapp with LLM analysis and ComfyUI integration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
