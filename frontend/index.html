<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>🎨 Image Generator</h1>
        
        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-steps">
                <div class="progress-step active" id="stepIndicator1">
                    <div class="step-dot"></div>
                    <div class="step-text">Select Profile & Image</div>
                </div>
                <div class="progress-step" id="stepIndicator2">
                    <div class="step-dot"></div>
                    <div class="step-text">Processing</div>
                </div>
                <div class="progress-step" id="stepIndicator3">
                    <div class="step-dot"></div>
                    <div class="step-text">Result</div>
                </div>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Screen 1: Profile Selection & Image Upload -->
            <div class="screen active" id="screen1">
                <div class="profile-section">
                    <label for="profileSelect">Select Profile:</label>
                    <select id="profileSelect">
                        <option value="">Loading profiles...</option>
                    </select>
                </div>
                
                <div class="upload-section" id="uploadSection">
                    <div class="upload-icon">📤</div>
                    <p>Click or drag an image here</p>
                    <p style="color: #999; font-size: 14px; margin-top: 10px;">Supports PNG, JPG</p>
                </div>
                
                <input type="file" id="fileInput" accept="image/*">
                <img id="previewImage" alt="Preview">
            </div>
            
            <!-- Screen 2: Processing (Analysis + Generation) -->
            <div class="screen" id="screen2">
                <div class="processing-section">
                    <div class="processing-spinner">
                        <div class="spinner"></div>
                    </div>
                    <p class="processing-text" id="processingText">Analyzing image...</p>
                    <div class="error-actions" id="errorActions" style="display: none;">
                        <button class="btn try-again-btn" id="tryAgainBtn">
                            <span class="btn-icon">↻</span>
                            Try Again
                        </button>
                        <button class="btn cancel-btn" id="cancelBtn">
                            <span class="btn-icon">✕</span>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Screen 3: Result -->
            <div class="screen" id="screen3">
                <div class="result-section">
                    <div class="result-image-container">
                        <img id="resultImage" alt="Generated">
                    </div>
                    
                    <div class="result-controls">
                        <div class="prompt-container">
                            <label for="promptText">📝 Prompt:</label>
                            <textarea class="prompt-text" id="promptText" rows="5"></textarea>
                        </div>
                        
                        <div class="resolution-selector">
                            <label for="resolutionSelect">Resolution:</label>
                            <select id="resolutionSelect">
                                <option value="1024x1024">1024 × 1024 (1:1)</option>
                                <option value="1024x768">1024 × 768 (4:3 Landscape)</option>
                                <option value="768x1024">768 × 1024 (4:3 Portrait)</option>
                                <option value="1280x720">1280 × 720 (16:9 Landscape)</option>
                                <option value="720x1280">720 × 1280 (16:9 Portrait)</option>
                                <option value="1536x688">1536 × 688 (20:9 Landscape)</option>
                                <option value="688x1536">688 × 1536 (20:9 Portrait)</option>
                            </select>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn new-btn" id="newBtn">
                                <span class="btn-icon">🔄</span>
                                New
                            </button>
                            <button class="btn reanalyze-btn" id="reanalyzeBtn">
                                <span class="btn-icon">↻</span>
                                Re-analyze
                            </button>
                            <button class="btn regenerate-btn" id="regenerateBtn">
                                <span class="btn-icon">✨</span>
                                Regenerate
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Error Display -->
        <div class="error-container" id="errorContainer">
            <div class="error-message" id="errorMessage"></div>
            <button class="error-close" id="errorClose">✕</button>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
