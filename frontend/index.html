<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enogu - Redraw reality</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Enogu - Redraw reality</h1>
        
        <!-- Navigation -->
        <nav class="main-nav">
            <button class="nav-btn active" id="navGenerate" onclick="showGenerateView()">Generate</button>
            <button class="nav-btn" id="navEditor" onclick="showProfileEditor()">Profile Editor</button>
            <button class="nav-btn" id="navConfig" onclick="showConfigEditor()">Settings</button>
        </nav>
        
        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-steps">
                <div class="progress-step active" id="stepIndicator1">
                    <div class="step-dot"></div>
                    <div class="step-text">Select Profile & Image</div>
                </div>
                <div class="progress-step" id="stepIndicator2">
                    <div class="step-dot"></div>
                    <div class="step-text">Processing</div>
                </div>
                <div class="progress-step" id="stepIndicator3">
                    <div class="step-dot"></div>
                    <div class="step-text">Result</div>
                </div>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Screen 1: Profile Selection & Image Upload -->
            <div class="screen active" id="screen1">
                <div class="profile-section">
                    <label for="profileSelect" class="label">Select Profile:</label>
                    <select id="profileSelect" class="select">
                        <option value="">Loading profiles...</option>
                    </select>
                </div>
                
                <div class="upload-section" id="uploadSection">
                    <div class="upload-icon">Upload</div>
                    <p>Click or drag an image here</p>
                    <p style="color: #999; font-size: 14px; margin-top: 10px;">Supports PNG, JPG</p>
                </div>
                
                <!-- Mobile camera capture button (shown only on mobile) -->
                <div class="camera-button-container" style="display: none;">
                    <button class="btn" id="cameraBtn">
                        Capture
                    </button>
                </div>
                
                <input type="file" id="fileInput" accept="image/*">
                <input type="file" id="cameraInput" accept="image/*" capture="user" style="display: none;">
                <img id="previewImage" alt="Preview">
            </div>
            
            <!-- Screen 2: Processing (Analysis + Generation) -->
            <div class="screen" id="screen2">
                <div class="processing-section">
                    <div class="processing-spinner">
                        <div class="spinner"></div>
                    </div>
                    <p class="processing-text" id="processingText">Analyzing image...</p>
                    <div class="error-actions" id="errorActions" style="display: none;">
                        <button class="btn primary" id="tryAgainBtn">
                            Retry
                        </button>
                        <button class="btn" id="cancelBtn">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Screen 3: Result -->
            <div class="screen" id="screen3">
                <div class="result-section">
                    <div class="result-image-container">
                        <img id="resultImage" alt="Generated">
                        <button class="download-btn" id="downloadBtn" title="Download image">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="control-sections">
                        <div class="regenerate-section">
                            <label for="resolutionSelect" class="label">Aspect Ratio:</label>
                            <select id="resolutionSelect" class="select">
                                <option value="1024x1024">1:1 (Square)</option>
                                <option value="768x1024" selected>4:3 (Portrait)</option>
                                <option value="1024x768">4:3 (Landscape)</option>
                                <option value="720x1280">16:9 (Portrait)</option>
                                <option value="1280x720">16:9 (Landscape)</option>
                                <option value="688x1536">20:9 (Portrait)</option>
                                <option value="1536x688">20:9 (Landscape)</option>
                            </select>
                            <button class="btn primary" id="regenerateBtn">
                                Regenerate
                            </button>
                        </div>
                        
                        <div class="upscale-section">
                            <label for="upscaleResolutionSelect" class="label">Upscale Factor:</label>
                            <select id="upscaleResolutionSelect" class="select">
                                <option value="1024">1x</option>
                                <option value="2048" selected>2x</option>
                                <option value="4096">4x</option>
                            </select>
                            <button class="btn primary upscale-btn" id="upscaleBtn">
                                Upscale
                            </button>
                        </div>
                    </div>
                    
                    <div class="prompt-container">
                        <label for="promptText" class="label">Prompt:</label>
                        <textarea id="promptText" class="prompt-text" rows="5"></textarea>
                        <div class="prompt-actions">
                            <button class="btn primary" id="reanalyzeBtn">
                                Re-analyze
                            </button>
                            <button class="btn" id="newBtn">
                                New
                            </button>
                        </div>
                    </div>
                    
                    <div class="profile-section">
                        <label for="profileSelectResult" class="label">Select Profile:</label>
                        <select id="profileSelectResult" class="select">
                            <option value="">Loading profiles...</option>
                        </select>
                    </div>
                </div>
                
                <!-- Image History -->
                <div class="history-section">
                    <h3>Image History (Last 10)</h3>
                    <div class="history-container" id="historyContainer">
                        <!-- History items will be added here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Profile Editor Screen -->
        <div class="profile-editor-container" id="profileEditorContainer" style="display: none;">
            <div class="editor-sidebar">
                <div class="editor-sidebar-header">
                    <h3>Profiles</h3>
                    <button class="btn small" id="downloadAllBtn" onclick="downloadAllProfiles()">Download All</button>
                </div>
                <div class="profile-list" id="profileList">
                    <!-- Profile items will be loaded here -->
                </div>
            </div>
            <div class="editor-main">
                <div class="editor-header">
                    <h2 id="editorProfileName">Select a profile</h2>
                    <div class="editor-actions">
                        <button class="btn primary" id="saveProfileBtn" onclick="saveCurrentProfile()" disabled>Save</button>
                        <button class="btn" id="duplicateProfileBtn" onclick="duplicateCurrentProfile()" disabled>Duplicate</button>
                        <button class="btn" id="renameProfileBtn" onclick="renameCurrentProfile()" disabled>Rename</button>
                        <button class="btn" id="deleteProfileBtn" onclick="deleteCurrentProfile()" disabled>Delete</button>
                    </div>
                </div>
                <div class="editor-tabs" id="editorTabs" style="display: none;">
                    <button class="tab-btn active" data-tab="extraction_prompt">extraction_prompt.txt</button>
                    <button class="tab-btn" data-tab="workflow">workflow.json</button>
                    <button class="tab-btn" data-tab="mappings">mappings.json</button>
                </div>
                <div class="editor-content" id="editorContent" style="display: none;">
                    <textarea class="editor-textarea" id="extractionPromptEditor" placeholder="extraction_prompt.txt content..."></textarea>
                    <textarea class="editor-textarea" id="workflowEditor" placeholder="workflow.json content..." style="display: none;"></textarea>
                    <textarea class="editor-textarea" id="mappingsEditor" placeholder="mappings.json content..." style="display: none;"></textarea>
                </div>
                <div class="editor-placeholder" id="editorPlaceholder">
                    <p>Select a profile from the sidebar to edit</p>
                </div>
            </div>
        </div>
        
        <!-- Configuration Editor Screen -->
        <div class="config-editor-container" id="configEditorContainer" style="display: none;">
            <div class="config-editor-main">
                <div class="config-editor-content">
                    <div class="config-section">
                        <h3>Providers</h3>
                        <div class="config-field">
                            <label for="comfyuiEndpoint" class="label">ComfyUI Endpoint:</label>
                            <input type="text" id="comfyuiEndpoint" class="input" placeholder="http://localhost:8188">
                        </div>
                        <div class="config-field">
                            <label for="llmEndpoint" class="label">LLM Endpoint:</label>
                            <input type="text" id="llmEndpoint" class="input" placeholder="http://localhost:8000/api/v1">
                        </div>
                        <div class="config-field">
                            <label for="llmApiKey" class="label">LLM API Key:</label>
                            <input type="text" id="llmApiKey" class="input" placeholder="your-api-key">
                        </div>
                        <div class="config-field">
                            <label for="llmModel" class="label">LLM Model:</label>
                            <div class="config-field-row">
                                <select id="llmModel" class="select">
                                    <option value="">Loading models...</option>
                                </select>
                                <button class="btn primary" id="refreshModelsBtn" onclick="refreshLLMModels()">Refresh Models</button>
                            </div>
                        </div>
                        <div class="config-actions">
                            <button class="btn primary" id="saveConfigBtn" onclick="saveConfig()">Save Configuration</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Error Display -->
        <div class="error-container" id="errorContainer">
            <div class="error-message" id="errorMessage"></div>
            <button class="error-close" id="errorClose">✕</button>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
